name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Build and Tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure

      - name: Generate Chinese Changelog
        run: |
          python3 - <<'PYEOF'
          import os
          import re
          import subprocess

          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          prev_tag = ""
          try:
              prev_tag = git("describe", "--tags", "--abbrev=0", f"{tag}^")
          except subprocess.CalledProcessError:
              prev_tag = ""

          tag_msg = ""
          try:
              if git("cat-file", "-t", tag) == "tag":
                  tag_msg = git("tag", "-l", "--format=%(contents)", tag).strip()
          except subprocess.CalledProcessError:
              tag_msg = ""

          if tag_msg:
              out = [tag_msg, ""]
          else:
              if prev_tag:
                  log_args = ["log", f"{prev_tag}..{tag}", "--no-merges", "--pretty=format:%h\t%s"]
              else:
                  log_args = ["log", tag, "--no-merges", "--max-count=30", "--pretty=format:%h\t%s"]

              log_lines = git(*log_args).splitlines()

              groups = [
                  ("✨ 新特性", ["feat"]),
                  ("🐛 问题修复", ["fix"]),
                  ("⚡ 性能优化", ["perf"]),
                  ("♻️ 重构与构建", ["refactor", "build", "ci"]),
                  ("📝 文档与测试", ["docs", "test"]),
                  ("📦 其他变更", ["chore", "style", "other"]),
              ]
              buckets = {title: [] for title, _ in groups}

              keyword_rules = [
                  ("🐛 问题修复", ["修复", "fix", "bug"]),
                  ("📝 文档与测试", ["文档", "注释", "readme", "comment", "测试", "test", "示例", "example"]),
                  ("⚡ 性能优化", ["性能", "优化", "benchmark", "基准"]),
                  ("♻️ 重构与构建", ["重构", "精简", "cmake", "workflow", "ci", "release", "工作流"]),
                  ("✨ 新特性", ["新增", "支持", "实现", "add", "feat"]),
              ]

              for line in log_lines:
                  if not line:
                      continue
                  sha, subj = line.split("\t", 1)
                  entry = f"- {subj} (`{sha}`)"
                  m = re.match(r"^([a-zA-Z]+)(?:\([^)]+\))?:\s*(.+)$", subj)
                  placed = False
                  if m:
                      kind = m.group(1).lower()
                      for title, prefixes in groups:
                          if kind in prefixes:
                              buckets[title].append(entry)
                              placed = True
                              break
                  if not placed:
                      low = subj.lower()
                      for title, kws in keyword_rules:
                          if any(kw in low for kw in kws):
                              buckets[title].append(entry)
                              placed = True
                              break
                  if not placed:
                      buckets["📦 其他变更"].append(entry)

              out = [f"# pollnet {tag} 发布说明\n"]
              out.append("C++20 跨平台、零堆分配、纯 Header-Only 低延迟轮询网络库（支持 Linux + Windows）。\n")
              for title, _ in groups:
                  items = buckets[title]
                  if items:
                      out.append(f"## {title}\n")
                      out.extend(items)
                      out.append("")

          out.extend([
              "## 📦 快速集成\n",
              f"- **直接拷贝头文件**：下载下方附件 `pollnet-{tag}-headers.tar.gz`（或 `.zip`）解压至项目 `third_party/` 目录即可使用；",
              "- **CMake 子目录 / FetchContent**：",
              "```cmake",
              "add_subdirectory(third_party/pollnet)",
              "target_link_libraries(your_app PRIVATE pollnet::pollnet)",
              "```\n",
          ])

          if prev_tag and f"{prev_tag}...{tag}" not in "\n".join(out):
              out.append(
                  f"**完整提交对比**：[`{prev_tag}...{tag}`](https://github.com/{repo}/compare/{prev_tag}...{tag})\n"
              )

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("\n".join(out))
          PYEOF

      - name: Package Header-Only Bundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p "dist/${TAG}/third_party"
          cp -r include/pollnet "dist/${TAG}/third_party/"
          cp README.md "dist/${TAG}/"
          for f in LICENSE*; do
            [ -e "$f" ] && cp "$f" "dist/${TAG}/"
          done
          tar -czf "pollnet-${TAG}-headers.tar.gz" -C "dist/${TAG}" .
          (cd "dist/${TAG}" && zip -rq "../../pollnet-${TAG}-headers.zip" .)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            "pollnet-${TAG}-headers.tar.gz" \
            "pollnet-${TAG}-headers.zip" \
            --title "pollnet ${TAG}" \
            --notes-file release_notes.md
