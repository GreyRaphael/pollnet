name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
          - os: windows-latest
            compiler: mingw

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Configure (Windows MSVC)
        if: matrix.compiler == 'msvc'
        run: cmake -S . -B build

      - name: Setup MinGW
        if: matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure (Windows MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build -j

      - name: Build (Windows MSVC)
        if: matrix.compiler == 'msvc'
        run: cmake --build build --config Debug -j

      - name: Build (Windows MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: cmake --build build -j

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows MSVC)
        if: matrix.compiler == 'msvc'
        run: ctest --test-dir build -C Debug --output-on-failure

      - name: Test (Windows MinGW)
        if: matrix.compiler == 'mingw'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
